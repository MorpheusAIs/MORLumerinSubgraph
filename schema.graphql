type Provider @entity {
  id: Bytes!
  endpoint: String!
  stake: BigInt!
}

type Subnet @entity {
  id: Bytes!
  # Metadata 
  name: String!
  endpoint: String!
  createdAt: BigInt!
  owner: Bytes!
  # Fee
  fee: BigInt!
  # Deregistration info
  deregistrationOpensAt: BigInt!
  isDeregistered: Boolean!
  # Metrics
  totalStaked: BigInt!
  totalClaimed: BigInt!
  #
  totalUsers: BigInt!
}

type SubnetUser @entity {
  # Subnet ID + User address
  id: Bytes!
  staked: BigInt!
  claimed: BigInt!

  subnet: Subnet!
  address: Bytes!
}

type BuildersProject @entity {
  id: Bytes!
  name: String!
  admin: Bytes!
  startsAt: BigInt!
  withdrawLockPeriodAfterDeposit: BigInt!
  claimLockEnd: BigInt!
  minimalDeposit: BigInt!
  totalStaked: BigInt!
  totalClaimed: BigInt!
  totalUsers: BigInt!
}

type BuildersUser @entity {
  # User address in Bytes + BuildersProject ID
  id: Bytes!
  address: Bytes!
  buildersProject: BuildersProject!
  staked: BigInt!
  lastStake: BigInt!
}

type Counter @entity {
  id: Bytes!
  totalSubnets: BigInt!
  totalBuildersProjects: BigInt!
}

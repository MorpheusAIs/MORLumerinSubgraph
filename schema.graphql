type Provider @entity {
  id: Bytes!
  endpoint: String!
  stake: BigInt!
}

type Subnet @entity {
  id: Bytes!
  # Metadata 
  name: String!
  endpoint: String!
  createdAt: BigInt!
  owner: Bytes!
  # Fee
  fee: BigInt!
  # Deregistration info
  deregistrationOpensAt: BigInt!
  isDeregistered: Boolean!
  # Metrics
  totalStaked: BigInt!
  totalClaimed: BigInt!
  #
  totalUsers: BigInt!
}

type SubnetUser @entity {
  # Subnet ID + User address
  id: Bytes!
  staked: BigInt!
  claimed: BigInt!

  subnet: Subnet!
  address: Bytes!
}

type BuilderSubnet @entity {
  id: Bytes!
  name: String!
  owner: Bytes!
  minStake: BigInt!
  fee: BigInt!
  feeTreasury: Bytes!
  startsAt: BigInt!
  withdrawLockPeriodAfterStake: BigInt!
  maxClaimLockEnd: BigInt!

  # Metadata 
  slug: String!
  description: String!
  website: String!
  image: String!

  # Statistics
  totalStaked: BigInt!
  totalClaimed: BigInt!
  totalUsers: BigInt!
  builderUsers: [BuilderUser!]! @derivedFrom(field: "builderSubnet")
}

type BuilderUser @entity {
  # User address in Bytes + BuildersProject ID
  id: Bytes!
  address: Bytes!
  builderSubnet: BuilderSubnet!
  staked: BigInt!
  claimed: BigInt!
  claimLockEnd: BigInt!
  lastStake: BigInt!
}

type Counter @entity {
  id: Bytes!
  totalSubnets: BigInt!
  totalBuilderProjects: BigInt!
}

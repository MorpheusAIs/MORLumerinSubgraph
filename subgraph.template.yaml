  - kind: ethereum
    name: Builders
    network: "{{ network }}"
    source:
      address: "{{ builders }}"
      abi: Builders
      startBlock: {{ buildersStartBlock }}
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Builder
      abis:
        - name: Builders
          file: ./abis/Builders.json
      eventHandlers:
        - event: Upgraded(indexed address)
          handler: handleUpgraded
        - event: BuilderPoolCreated(indexed bytes32,(string,address,uint128,uint128,uint128,uint256))
          handler: handleBuilderPoolCreated
        - event: BuilderPoolEdited(indexed bytes32,(string,address,uint128,uint128,uint128,uint256))
          handler: handleBuilderPoolEdited
        - event: SubnetCreated(indexed bytes32,(string,address,uint128,uint128,uint128,uint256,address))
          handler: handleSubnetCreated
        - event: SubnetEdited(indexed bytes32,(string,address,uint128,uint128,uint128,uint256,address))
          handler: handleSubnetEdited
        - event: SubnetMetadataEdited(indexed bytes32,(string,string,string,string))
          handler: handleSubnetMetadataEdited
        - event: UserDeposited(indexed bytes32,indexed address,uint256)
          handler: handleUserDeposited
        - event: UserWithdrawn(indexed bytes32,indexed address,uint256)
          handler: handleUserWithdrawn
        - event: AdminClaimed(indexed bytes32,address,uint256)
          handler: handleAdminClaimed
      file: ./src/mappings/builders.ts

